# Copy to config.yaml and edit. config.yaml is gitignored (never commit keys).

mode: backtest          # backtest | paper | live
exchange: binance
symbol: BTC/USDT
# For multi-symbol portfolio backtests (run_portfolio.py). Capital is shared
# and capped at risk.max_positions concurrent positions. Leave empty to use
# just `symbol` above.
symbols: []             # e.g. [BTC/USDT, ETH/USDT, SOL/USDT]
timeframe: 1h
start_equity: 200       # used for backtest & paper accounting (your real $50-200)
history_limit: 1500     # candles to pull for backtest
poll_seconds: 60        # live/paper loop interval

# Testnet keys from https://testnet.binance.vision/ (free, fake money).
# Required for paper/live modes. Leave empty for backtest.
testnet: true
api_key: ""
api_secret: ""

# Crash-safe state file: a restart resumes the open position + stops from here.
state_file: state.json

# Optional Telegram alerts on trades / kill-switch / errors. Leave empty to
# disable. token from @BotFather, chat_id from @userinfobot.
telegram_token: ""
telegram_chat_id: ""

risk:
  risk_per_trade: 0.01    # risk 1% of equity per trade
  stop_atr_mult: 2.0      # stop = 2 * ATR below entry
  take_profit_rr: 2.0     # take-profit at 2x the stop distance (reward:risk 2:1)
  max_drawdown: 0.20      # halt everything if equity drops 20% from its peak
  max_positions: 1
  fee_rate: 0.001         # 0.1% per side — realistic spot taker fee
  slippage: 0.0005        # 0.05% assumed slippage per side

strategy:
  # Available: ema_rsi | mean_reversion | donchian_breakout | supertrend |
  #            macd_trend | bollinger_reversion | regime_ensemble
  # regime_ensemble adapts: trend-follows when ADX is high, mean-reverts when low.
  # Tip: run `python run_select.py` to let the bot pick the best one for you.
  name: ema_rsi
  params:
    ema_fast: 20
    ema_slow: 50
    rsi_period: 14
    rsi_max: 70
    rsi_min: 50
    atr_period: 14

# Parameter grid for run_optimize.py. Each listed param is swept over its
# values; walk-forward then validates the winner out-of-sample.
optimize:
  ema_fast: [10, 20, 30]
  ema_slow: [50, 100, 150]
  rsi_max: [65, 70, 75]
